<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Deep Ocean Sky Gradient -->
    <linearGradient id="sky-grad" x1="32" y1="0" x2="32" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#054458" />
      <stop offset="60%" stop-color="#086782" />
      <stop offset="100%" stop-color="#032834" />
    </linearGradient>

    <!-- Golden Sun Gradient -->
    <linearGradient id="sun-grad" x1="32" y1="12" x2="32" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF3B0" />
      <stop offset="45%" stop-color="#F9D776" />
      <stop offset="100%" stop-color="#E58E26" />
    </linearGradient>

    <!-- Mountain Rinjani Facets -->
    <linearGradient id="mt-lit" x1="20" y1="18" x2="32" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#55D0EB" />
      <stop offset="100%" stop-color="#095D75" />
    </linearGradient>
    <linearGradient id="mt-shadow" x1="32" y1="18" x2="44" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#095D75" />
      <stop offset="100%" stop-color="#032430" />
    </linearGradient>

    <!-- Sembalun Hill Gradient -->
    <linearGradient id="hill-grad" x1="10" y1="36" x2="48" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1DB996" />
      <stop offset="100%" stop-color="#085244" />
    </linearGradient>

    <!-- Ocean Wave Gradients -->
    <linearGradient id="wave-grad-1" x1="0" y1="44" x2="64" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2ED5E8" />
      <stop offset="100%" stop-color="#0083A8" />
    </linearGradient>
    <linearGradient id="wave-grad-2" x1="0" y1="52" x2="64" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00A5CF" />
      <stop offset="100%" stop-color="#023E50" />
    </linearGradient>

    <!-- Gold Border Ring -->
    <linearGradient id="gold-rim" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F9D776" />
      <stop offset="50%" stop-color="#E58E26" />
      <stop offset="100%" stop-color="#F9D776" />
    </linearGradient>
  </defs>

  <!-- Squircle Base Canvas -->
  <rect width="64" height="64" rx="16" fill="url(#sky-grad)" />
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="url(#gold-rim)" stroke-width="2" stroke-opacity="0.9" />

  <!-- Sun Rays Behind Mount Rinjani -->
  <g opacity="0.45" stroke="#F9D776" stroke-width="1.5" stroke-linecap="round">
    <line x1="32" y1="7" x2="32" y2="12" />
    <line x1="20" y1="12" x2="23" y2="16" />
    <line x1="44" y1="12" x2="41" y2="16" />
    <line x1="12" y1="21" x2="17" y2="23" />
    <line x1="52" y1="21" x2="47" y2="23" />
  </g>

  <!-- Radiant Golden Sunrise -->
  <circle cx="32" cy="24" r="11" fill="url(#sun-grad)" />
  <circle cx="32" cy="24" r="13" stroke="#FFF3B0" stroke-width="1" stroke-opacity="0.35" />

  <!-- Mount Rinjani - Back Lit Peak -->
  <!-- Left illuminated side -->
  <path d="M32 18L16 44H32V18Z" fill="url(#mt-lit)" />
  <!-- Right shadow side -->
  <path d="M32 18L48 44H32V18Z" fill="url(#mt-shadow)" />
  <!-- Snow / Glowing Summit Cap -->
  <path d="M32 18L35.5 24L32 26.5L28.5 24L32 18Z" fill="#FFFFFF" fill-opacity="0.95" />

  <!-- Sembalun Rolling Foothills -->
  <path
    d="M8 46C15 40 22 42 28 45C34 48 42 43 56 46V54H8V46Z"
    fill="url(#hill-grad)"
  />

  <!-- Ocean Waves Layer 1 -->
  <path
    d="M6 48C13 45.5 19 48 26 46.5C33 45 39 48 58 45.5C60 45.3 62 45.5 64 46V56C64 60.4 60.4 64 56 64H8C3.6 64 0 60.4 0 56V49C2 48.2 4 48.7 6 48Z"
    fill="url(#wave-grad-1)"
  />

  <!-- Foam Crest Highlight 1 -->
  <path
    d="M7 47.5C14 45 20 47.5 27 46C34 44.5 40 47.5 57 45"
    stroke="#FFFFFF"
    stroke-width="1.8"
    stroke-linecap="round"
  />

  <!-- Ocean Waves Layer 2 (Foreground Deep) -->
  <path
    d="M4 54C12 52 18 54.5 25 53C32 51.5 38 54 60 52V64H8C4.5 64 1.5 61.5 0.5 58C1.5 56.5 2.8 54.8 4 54Z"
    fill="url(#wave-grad-2)"
  />

  <!-- Foam Crest Highlight 2 -->
  <path
    d="M8 53.5C15 51.5 21 54 28 52.5C35 51 41 53.5 56 51.5"
    stroke="#2ED5E8"
    stroke-width="1.4"
    stroke-linecap="round"
  />

  <!-- Star of Adventure (Compass Sparkle) -->
  <path
    d="M50 11L51.2 14.5L54.5 15.5L51.2 16.5L50 20L48.8 16.5L45.5 15.5L48.8 14.5L50 11Z"
    fill="#FFF3B0"
  />
  <circle cx="50" cy="15.5" r="1" fill="#FFFFFF" />
</svg>
